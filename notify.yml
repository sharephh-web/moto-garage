name: Garage Notify
on:
  schedule:
    - cron: '0 0 * * *'   # 매일 한국시간 오전 9시 (UTC 0시)
  workflow_dispatch:       # 수동 실행 버튼 (테스트 알림도 발송)
permissions:
  contents: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install web-push@3 --no-save
      - run: node notify.mjs
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && 'test' || '' }}
      - name: Save changes
        run: |
          git config user.name "garage-bot"
          git config user.email "garage-bot@users.noreply.github.com"
          git add -A vapid.json vapid-public.json push-subs.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "notify bot update"
            git push
          fi
